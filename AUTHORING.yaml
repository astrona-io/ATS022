version: 1
approval: Maintainer requested CKA and CKS playgrounds and graded labs on 2026-10-13,
  superseding the earlier reading-only scope.
course:
  id: ATS022
  certification:
    name: Certified Kubernetes Administrator
    code: CKA
    provider: CNCF / Linux Foundation
    domain: Storage
    weight: 10
    competencies:
    - Implement storage classes and dynamic volume provisioning
    - Configure volume types, access modes and reclaim policies
    - Manage persistent volumes and persistent volume claims
defaults:
  playground: true
  module_lab: false
  capstone: false
  section_quiz: true
  final_quiz: true
assessment_format: YAML question banks, schema version 1; indexed in assessments/index.yaml
sections:
- id: section-010
  title: Implement storage classes and dynamic volume provisioning
  curriculum_item: Implement storage classes and dynamic volume provisioning
  capstone: false
  section_quiz: true
  modules:
  - id: module-01
    title: Storage Classes And Provisioning Decisions
    objectives:
    - Explain class selection and dynamic provisioning.
    - Distinguish expected delayed binding from failure.
    - Evaluate topology, expansion and driver capabilities.
    - Identify retention consequences before administrative changes.
    outline:
    - Provisioning, Classes And Drivers
    playground: true
    module_lab: true
    sources:
    - reading: sections/section-010/module-01/course-01-provisioning-classes-and-drivers.md
      adapted_from: ATS038/sections/section-040/module-01/course-02-provisioning-classes-and-drivers.md
    - reading: sections/section-010/module-01/course-02-guided-practice.md
      adapted_from: null
    labs:
    - id: lab-01
      path: sections/section-010/module-01/labs/lab-01
      after_reading: sections/section-010/module-01/course-01-provisioning-classes-and-drivers.md
      objective: Create a class and claim whose storage binds when its consumer can
        be scheduled.
      status: alpha
      runtime_verification: pending
    practice_readings:
    - sections/section-010/module-01/course-02-guided-practice.md
- id: section-020
  title: Configure volume types, access modes and reclaim policies
  curriculum_item: Configure volume types, access modes and reclaim policies
  capstone: false
  section_quiz: true
  modules:
  - id: module-01
    title: Volume Lifetime, Access And Reclaim
    objectives:
    - Compare ephemeral and persistent volume lifetimes.
    - Interpret access and volume modes.
    - Explain application concurrency limits.
    - Predict reclaim and recovery consequences.
    outline:
    - Storage Lifecycles And Claims
    - Access Modes And Data Presentation
    - Reclaim Policies And Recovery
    playground: true
    module_lab: true
    sources:
    - reading: sections/section-020/module-01/course-01-storage-lifecycles-and-claims.md
      adapted_from: ATS038/sections/section-040/module-01/course-01-storage-lifecycles-and-claims.md
    - reading: sections/section-020/module-01/course-02-access-modes-and-data-presentation.md
      adapted_from: ATS038/sections/section-040/module-02/course-01-access-modes-and-data-presentation.md
    - reading: sections/section-020/module-01/course-03-reclaim-policies-and-recovery.md
      adapted_from: ATS038/sections/section-040/module-02/course-02-reclaim-policies-and-recovery.md
    - reading: sections/section-020/module-01/course-04-guided-practice.md
      adapted_from: null
    labs:
    - id: lab-01
      path: sections/section-020/module-01/labs/lab-01
      after_reading: sections/section-020/module-01/course-01-storage-lifecycles-and-claims.md
      objective: Observe persistent data surviving replacement while Pod-lifetime
        scratch data disappears.
      status: alpha
      runtime_verification: pending
    - id: lab-02
      path: sections/section-020/module-01/labs/lab-02
      after_reading: sections/section-020/module-01/course-03-reclaim-policies-and-recovery.md
      objective: Change a bound volume reclaim policy while preserving its active
        claim and consumer.
      status: alpha
      runtime_verification: pending
    practice_readings:
    - sections/section-020/module-01/course-04-guided-practice.md
- id: section-030
  title: Manage persistent volumes and persistent volume claims
  curriculum_item: Manage persistent volumes and persistent volume claims
  capstone: false
  section_quiz: true
  modules:
  - id: module-01
    title: Persistent Object Binding And Administration
    objectives:
    - Explain PV and PVC scope and matching.
    - Distinguish static binding from dynamic allocation.
    - Diagnose provisioning, attachment and mount stages.
    - Evaluate expansion and safe retained-volume reuse.
    outline:
    - Binding, Expansion And Administrative Storage Decisions
    playground: true
    module_lab: true
    sources:
    - reading: sections/section-030/module-01/course-01-binding-expansion-and-administrative-storage-decisions.md
      adapted_from: null
    - reading: sections/section-030/module-01/course-02-guided-practice.md
      adapted_from: null
    labs:
    - id: lab-01
      path: sections/section-030/module-01/labs/lab-01
      after_reading: sections/section-030/module-01/course-01-binding-expansion-and-administrative-storage-decisions.md
      objective: Bind a named claim without invoking the default dynamic provisioner.
      status: alpha
      runtime_verification: pending
    practice_readings:
    - sections/section-030/module-01/course-02-guided-practice.md
