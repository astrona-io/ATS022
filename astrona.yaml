training:
  id: ATS022
  title: 'CKA: Storage'
  description: Reading lessons, ungraded playgrounds, graded labs, section capstones and
    knowledge-check quizzes covering the CKA Storage domain. They cover StorageClasses and dynamic
    provisioning, volume types, access modes and reclaim policies, and PersistentVolume
    and PersistentVolumeClaim management. Technical content remains draft for review.
  certification:
    name: Certified Kubernetes Administrator
    code: CKA
    provider: CNCF / Linux Foundation
    domain: Storage
    weight: 10
    competencies:
    - Implement storage classes and dynamic volume provisioning
    - Configure volume types, access modes and reclaim policies
    - Manage persistent volumes and persistent volume claims
modules:
