apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: relay
  namespace: starfleet
spec:
  serviceName: relay
  replicas: 2
  selector:
    matchLabels:
      app: relay
  template:
    metadata:
      labels:
        app: relay
    spec:
      containers:
      - name: relay
        image: docker.io/library/busybox:1.37.0
        command:
        - sh
        - -c
        - hostname > /store/owner; sleep 36000
        volumeMounts:
        - name: store
          mountPath: /store
  volumeClaimTemplates:
  - metadata:
      name: store
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: standard
      resources:
        requests:
          storage: 50Mi
