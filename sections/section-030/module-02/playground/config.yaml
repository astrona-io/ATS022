# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Resize A Persistent Volume Claim (PLAYGROUND). Clean sandbox, no task, no grading.
apiVersion: astrona.io/v1
metadata:
  name: ats-022-playground-030-02
  docs:
    guide: docs/overview.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - docker.io/library/busybox:1.37.0

# Starting state: two StorageClasses (one without expansion), two 100Mi claims
# and a Deployment that mounts both.
bootstrap:
  manifests:
    - name: storage
      type: file
      source: manifests/storage.yaml
  waitFor:
    - resource: nodes
      all: true
    - resource: deploy/data-writer
      namespace: starfleet

teardown:
  keepCluster: false
