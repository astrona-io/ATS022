# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Control Which Volume A Claim Binds (LAB). Graded against the live cluster. UNTESTED.
apiVersion: astrona.io/v1
metadata:
  name: ats-022-lab-030-03
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - docker.io/library/busybox:1.37.0

# Starting state: three static volumes (crate-a, crate-b, vault-1) and the
# Pending claim `manifest`. The learner writes the claim `ledger`.
bootstrap:
  init:
    - name: seed-cluster
      description: Create the static volumes and the Pending claim
      type: file
      source: bootstrap/01-seed-cluster.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: ledger-bound-to-fast-volume
      description: The claim ledger is Bound to a volume labelled tier=fast
      type: file
      source: validation/validate-ledger-bound-to-fast-volume.sh
      hint: Create the claim ledger in starfleet with the class manual and a selector on the label tier.
    - name: ledger-uses-selector
      description: The claim ledger chooses its volume with a label selector
      type: file
      source: validation/validate-ledger-uses-selector.sh
      hint: Use spec.selector.matchLabels with tier fast. Do not set volumeName.
    - name: ledger-request
      description: The claim ledger asks for 100Mi ReadWriteOnce from the class manual
      type: file
      source: validation/validate-ledger-request.sh
      hint: Keep the class manual, the mode ReadWriteOnce and the request 100Mi.
    - name: manifest-bound-to-vault
      description: The claim manifest is Bound to vault-1
      type: file
      source: validation/validate-manifest-bound-to-vault.sh
      hint: Describe the claim and compare class, mode and size with the volumes. A claim cannot be edited, so create it again.
    - name: volumes-unchanged
      description: The static volumes are unchanged
      type: file
      source: validation/validate-volumes-unchanged.sh
      hint: Fix the claims. Do not edit or delete the volumes.

teardown:
  keepCluster: false
