# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Mount Claims In Workloads And Protect Them (PLAYGROUND). Clean sandbox, no task, no grading.
apiVersion: astrona.io/v1
metadata:
  name: ats-022-playground-030-04
  docs:
    guide: docs/overview.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - docker.io/library/busybox:1.37.0

# Starting state: a claim `old-claim` mounted by the Pod `holder`, and a
# headless Service `beacon-log` for a StatefulSet that the learner creates.
bootstrap:
  manifests:
    - name: workloads
      type: file
      source: manifests/workloads.yaml
  waitFor:
    - resource: nodes
      all: true

teardown:
  keepCluster: false
