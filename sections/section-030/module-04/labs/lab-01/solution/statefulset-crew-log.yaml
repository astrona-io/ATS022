apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: crew-log
  namespace: starfleet
spec:
  serviceName: crew-log
  replicas: 2
  selector:
    matchLabels:
      app: crew-log
  template:
    metadata:
      labels:
        app: crew-log
    spec:
      containers:
      - name: writer
        image: docker.io/library/busybox:1.37.0
        command:
        - sh
        - -c
        - hostname > /data/owner; sleep 36000
        volumeMounts:
        - name: data
          mountPath: /data
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: standard
      resources:
        requests:
          storage: 50Mi
