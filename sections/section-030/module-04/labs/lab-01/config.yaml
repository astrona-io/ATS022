# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Mount Claims In Workloads And Protect Them (LAB). Graded against the live cluster. UNTESTED.
apiVersion: astrona.io/v1
metadata:
  name: ats-022-lab-030-04
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - docker.io/library/busybox:1.37.0

# Starting state: headless Service crew-log, and the claim old-claim stuck in
# Terminating because the Pod holder mounts it. The learner writes the StatefulSet.
bootstrap:
  init:
    - name: seed-cluster
      description: Create the Service, the claim in use and the Pod that holds it
      type: file
      source: bootstrap/01-seed-cluster.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: statefulset-ready
      description: The StatefulSet crew-log runs 2 ready replicas
      type: file
      source: validation/validate-statefulset-ready.sh
      hint: Create a StatefulSet crew-log in starfleet with replicas 2 and serviceName crew-log.
    - name: claims-per-replica
      description: Each replica has its own Bound claim from the template data
      type: file
      source: validation/validate-claims-per-replica.sh
      hint: Use volumeClaimTemplates with the name data, ReadWriteOnce, 50Mi and the class standard.
    - name: per-pod-data
      description: Each replica wrote its host name to /data/owner on its own claim
      type: file
      source: validation/validate-per-pod-data.sh
      hint: The container runs hostname > /data/owner and mounts the template at /data.
    - name: old-claim-released
      description: The claim old-claim and the Pod holder are gone
      type: file
      source: validation/validate-old-claim-released.sh
      hint: Find the Pod that holds the claim with describe and delete the Pod. Do not patch the finalizer.

teardown:
  keepCluster: false
