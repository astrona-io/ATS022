# Knowledge check for section 010. Listed in astrona.yaml as a `type: quiz` entry after the capstone lab.
schema_version: 1
kind: question_bank
id: ats022-010
course_id: ATS022
exam_code: CKA
status: draft
provenance: Original practice material written for this course; not official exam questions.
scope:
  type: section
  id: section-010
  title: "Implement storage classes and dynamic volume provisioning"
questions:
  - id: ats022-010-q01
    type: single_choice
    difficulty: beginner
    learning_objective: "Explain what a StorageClass holds and which component creates the volume"
    source_readings:
      - sections/section-010/module-01/course-01-provisioning-classes-and-drivers.md
    prompt: |-
      A team writes a PersistentVolumeClaim that names the StorageClass `training-fast`. Which statement about the class is correct?
    options:
      - id: a
        text: "The class is a namespaced object and must be in the same namespace as the claim."
        explanation: "A StorageClass is cluster-scoped and has no namespace."
      - id: b
        text: "The class contains the data of the volume."
        explanation: "The data lives in the volume the provisioner creates, not in the class."
      - id: c
        text: "The class starts the controller that creates volumes."
        explanation: "Creating a class does not install or start a provisioner. A controller that serves the provisioner name must already run."
      - id: d
        text: "The class names a provisioner and settings that are used when a volume is created for the claim."
        explanation: "Correct. The class holds the provisioner name, parameters, reclaim policy, binding mode and expansion setting."
    correct_option: d
    explanation: "A StorageClass is a cluster-scoped description of how to create volumes. It does not run anything."

  - id: ats022-010-q02
    type: single_choice
    difficulty: beginner
    learning_objective: "Distinguish expected delayed binding from failure"
    source_readings:
      - sections/section-010/module-02/course-01-storageclass-fields-and-what-they-control.md
    prompt: |-
      A claim uses a class with `volumeBindingMode: WaitForFirstConsumer`. No Pod uses the claim. The claim is `Pending`. What is the correct conclusion?
    options:
      - id: a
        text: "The claim must be deleted because the class is wrong."
        explanation: "The class is valid. Deleting the claim gains nothing."
      - id: b
        text: "The node has no free disk space."
        explanation: "Disk space is not involved until a volume is requested."
      - id: c
        text: "The provisioner has crashed and must be restarted."
        explanation: "No evidence points at the provisioner. With this binding mode the provisioner is not asked yet."
      - id: d
        text: "The behavior is expected. The volume is created after a Pod that uses the claim is scheduled."
        explanation: "Correct. The scheduler needs a Pod to pick a node first, then the volume is created for that node."
    correct_option: d
    explanation: "WaitForFirstConsumer delays creation until a consuming Pod exists, so a Pending claim without a Pod is healthy."

  - id: ats022-010-q03
    type: single_choice
    difficulty: beginner
    learning_objective: "Name the StorageClass fields that cannot be changed after creation"
    source_readings:
      - sections/section-010/module-02/course-01-storageclass-fields-and-what-they-control.md
    prompt: |-
      An administrator runs `kubectl patch storageclass training-archive --type merge -p '{"reclaimPolicy":"Delete"}'` and the API server rejects it. What is the way to get a class with that policy?
    options:
      - id: a
        text: "Restart the kube-apiserver."
        explanation: "A restart does not change the validation rules."
      - id: b
        text: "Delete the class and create it again with the new policy."
        explanation: "Correct. `provisioner`, `parameters`, `reclaimPolicy` and `volumeBindingMode` cannot be edited. Existing PVs keep their own copy of the policy."
      - id: c
        text: "Patch the PersistentVolumes first, then the class."
        explanation: "Patching PVs does not make the class editable."
      - id: d
        text: "Add the annotation `storageclass.kubernetes.io/mutable: \"true\"` to the class."
        explanation: "No such annotation exists."
    correct_option: b
    explanation: "The four fields are immutable, so the class must be replaced."

  - id: ats022-010-q04
    type: single_choice
    difficulty: intermediate
    learning_objective: "Predict the class of a claim that omits storageClassName"
    source_readings:
      - sections/section-010/module-02/course-02-the-default-storageclass-and-claim-class-selection.md
    prompt: |-
      The cluster has `standard` as the default class. A user applies a claim with no `storageClassName` field. Later an administrator moves the default annotation to `training-fast`. Which class does the existing claim have?
    options:
      - id: a
        text: "`training-fast`, because the control plane updates claims when the default moves."
        explanation: "Claims are updated later only when no default existed at creation. Here a default existed."
      - id: b
        text: "`standard`, because the class is written into the claim when it is created."
        explanation: "Correct. The DefaultStorageClass admission step writes the name at creation time and it never changes."
      - id: c
        text: "No class, because the default only applies to claims that set an empty string."
        explanation: "An empty string is a different value that disables the default. An absent field gets the default."
      - id: d
        text: "Either class, chosen again at each Pod start."
        explanation: "The class is a field of the claim, not chosen at Pod start."
    correct_option: b
    explanation: "The default class is written into the claim at creation and stays."

  - id: ats022-010-q05
    type: single_choice
    difficulty: intermediate
    learning_objective: "Use an empty storageClassName to bind a manually created volume"
    source_readings:
      - sections/section-010/module-02/course-02-the-default-storageclass-and-claim-class-selection.md
    prompt: |-
      A cluster has a default class. An administrator created a PersistentVolume with no class. Which claim setting binds to it and avoids dynamic provisioning?
    options:
      - id: a
        text: "Set `storageClassName: \"\"` in the claim."
        explanation: "Correct. An empty string asks for no class, so only a PV with an empty class can match."
      - id: b
        text: "Set `storageClassName: standard` in the claim."
        explanation: "The claim would use the default class and a provisioner would create a new volume."
      - id: c
        text: "Set `volumeBindingMode: Immediate` in the claim."
        explanation: "`volumeBindingMode` is a field of the class, not of the claim."
      - id: d
        text: "Omit `storageClassName` from the claim."
        explanation: "An absent field receives the default class, so the claim asks for dynamic provisioning."
    correct_option: a
    explanation: "An empty string disables the default class for that claim."

  - id: ats022-010-q06
    type: single_choice
    difficulty: intermediate
    learning_objective: "Mark and unmark the default StorageClass with its annotation"
    source_readings:
      - sections/section-010/module-02/course-02-the-default-storageclass-and-claim-class-selection.md
    prompt: |-
      Two classes carry `storageclass.kubernetes.io/is-default-class: "true"`. A claim with no class is created. Which class does it get?
    options:
      - id: a
        text: "Neither. The API server rejects the claim."
        explanation: "The API server accepts the claim."
      - id: b
        text: "The one with the larger capacity."
        explanation: "Capacity is not a property of a class."
      - id: c
        text: "The one whose name sorts first."
        explanation: "Name order is not used."
      - id: d
        text: "The one that was created most recently."
        explanation: "Correct. Kubernetes allows several defaults and picks the newest, so keep only one."
    correct_option: d
    explanation: "With several defaults the newest wins, and the administrator should keep exactly one."

  - id: ats022-010-q07
    type: single_choice
    difficulty: intermediate
    learning_objective: "Read the events of a Pending claim and name the cause"
    source_readings:
      - sections/section-010/module-03/course-01-reading-a-pending-claim.md
    prompt: |-
      A claim is Pending. `kubectl describe pvc` shows an event from the PV controller that a StorageClass named `standard-fast` was not found. Which action fixes it?
    options:
      - id: a
        text: "Patch `storageClassName` on the claim to `standard`."
        explanation: "The field cannot be edited after creation, so the patch is rejected."
      - id: b
        text: "Restart the Pod that uses the claim."
        explanation: "The Pod is not the problem. Restarting does not create the class."
      - id: c
        text: "Create a StorageClass named `standard-fast`, or recreate the claim with a class that exists."
        explanation: "Correct. Either the claim gets the object it names, or it is replaced with a valid one."
      - id: d
        text: "Increase the memory of the node."
        explanation: "Memory is unrelated to a missing class."
    correct_option: c
    explanation: "A missing class is repaired by creating it or by replacing the claim."

  - id: ats022-010-q08
    type: single_choice
    difficulty: intermediate
    learning_objective: "Find a class whose provisioner has no running controller"
    source_readings:
      - sections/section-010/module-03/course-01-reading-a-pending-claim.md
    prompt: |-
      A claim uses the class `training-offline` and a Pod uses the claim. The only event on the claim has the reason `ExternalProvisioning`. Nothing follows after several minutes. What is the most likely cause?
    options:
      - id: a
        text: "The claim is waiting for its first consumer."
        explanation: "A Pod already uses the claim, so the first consumer exists."
      - id: b
        text: "No controller serves the provisioner name in the class."
        explanation: "Correct. The class exists and is valid, but no provisioner Pod acts on its name, so nothing writes further events."
      - id: c
        text: "The Pod has no resource requests."
        explanation: "Requests of the Pod do not affect provisioning."
      - id: d
        text: "The claim requests more than the node allows."
        explanation: "A size problem would produce a provisioning failure event from a controller."
    correct_option: b
    explanation: "ExternalProvisioning alone means the claim waits for a controller that is not there."

  - id: ats022-010-q09
    type: single_choice
    difficulty: intermediate
    learning_objective: "Repair a claim by deleting and recreating it"
    source_readings:
      - sections/section-010/module-03/course-02-repairing-a-pending-claim.md
    prompt: |-
      A claim `reports` with a wrong class is used by the Pod `reports-writer`. Which order of actions repairs it?
    options:
      - id: a
        text: "Delete the Pod, delete the claim, then create the claim with a valid class and the Pod again."
        explanation: "Correct. The claim class and the Pod volumes cannot be edited, and a claim in use is protected until the Pod is deleted."
      - id: b
        text: "Patch the claim class, then patch the Pod volumes."
        explanation: "Both patches are rejected."
      - id: c
        text: "Delete only the Pod and keep the claim."
        explanation: "The claim still has the wrong class."
      - id: d
        text: "Delete the claim first, then the Pod, then edit nothing."
        explanation: "A claim in use stays Terminating until the Pod is gone, so the Pod comes first."
    correct_option: a
    explanation: "Delete the Pod, then the claim, then create both again."

  - id: ats022-010-q10
    type: single_choice
    difficulty: advanced
    learning_objective: "Plan a class and claim set so that data survives claim deletion"
    source_readings:
      - sections/section-010/module-02/course-01-storageclass-fields-and-what-they-control.md
    prompt: |-
      A team creates a class with `reclaimPolicy: Retain` today. A claim `old-data` was provisioned yesterday by the same class name, before an administrator recreated the class with `Retain` (it was `Delete` before). The team deletes `old-data`. What happens to its volume?
    options:
      - id: a
        text: "It is kept, because deleting a claim never deletes a volume."
        explanation: "With `Delete` the provisioner removes the volume and the backing data."
      - id: b
        text: "It is deleted only after the class is deleted."
        explanation: "Deleting the class has no effect on the PV."
      - id: c
        text: "It is kept, because the class now says Retain."
        explanation: "The class change does not reach PVs that already exist."
      - id: d
        text: "It is deleted, because the PV copied `Delete` from the class when it was created."
        explanation: "Correct. Each PV holds its own copy of the policy from creation time. Patch the PV to Retain before deleting the claim."
    correct_option: d
    explanation: "The reclaim policy lives on the PV from the moment it is created."
