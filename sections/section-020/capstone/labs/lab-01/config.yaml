# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Volume Types, Access Modes And Reclaim Handling Capstone (LAB). Graded against the live cluster. UNTESTED.
apiVersion: astrona.io/v1
metadata:
  name: ats-022-capstone-020
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - docker.io/library/busybox:1.37.0

bootstrap:
  init:
    - name: seed-cluster
      description: Create the settings objects, a Released PV and a dynamic claim in use
      type: file
      source: bootstrap/01-seed-cluster.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: logger-volumes
      description: probe-logger shares a memory emptyDir and reads read-only projected settings
      type: file
      source: validation/validate-logger-volumes.sh
      hint: Use emptyDir with medium Memory and sizeLimit 32Mi, and one projected volume with a configMap and a secret source. Set mode 0400 on the token item.
    - name: ledger-claim
      description: ledger-current is ReadWriteOncePod and bound to training-ledger
      type: file
      source: validation/validate-ledger-claim.sh
      hint: A Released volume keeps its claimRef. Remove it before you create the claim.
    - name: ledger-extra-pending
      description: ledger-extra stays Pending on the same claim
      type: file
      source: validation/validate-ledger-extra-pending.sh
      hint: Create a second Pod that mounts ledger-current. The scheduler keeps it Pending.
    - name: journal-volume-survives
      description: The volume behind journal survives as Released with Retain
      type: file
      source: validation/validate-journal-volume-survives.sh
      hint: Patch the PV to Retain before the claim is deleted.
    - name: journal-objects-removed
      description: journal and journal-writer are removed
      type: file
      source: validation/validate-journal-objects-removed.sh
      hint: Delete the Pod first, then the claim.

teardown:
  keepCluster: false
