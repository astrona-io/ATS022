apiVersion: v1
kind: Pod
metadata:
  name: probe-logger
  namespace: starfleet
spec:
  containers:
    - name: collector
      image: docker.io/library/busybox:1.37.0
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: spool
          mountPath: /spool
    - name: reporter
      image: docker.io/library/busybox:1.37.0
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: spool
          mountPath: /spool
        - name: settings
          mountPath: /etc/probe
          readOnly: true
  volumes:
    - name: spool
      emptyDir:
        medium: Memory
        sizeLimit: 32Mi
    - name: settings
      projected:
        sources:
          - configMap:
              name: probe-settings
          - secret:
              name: probe-token
              items:
                - key: token
                  path: token
                  mode: 0400
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ledger-current
  namespace: starfleet
spec:
  accessModes:
    - ReadWriteOncePod
  storageClassName: ""
  volumeName: training-ledger
  resources:
    requests:
      storage: 64Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: ledger-writer
  namespace: starfleet
spec:
  containers:
    - name: writer
      image: docker.io/library/busybox:1.37.0
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: ledger
          mountPath: /ledger
  volumes:
    - name: ledger
      persistentVolumeClaim:
        claimName: ledger-current
---
apiVersion: v1
kind: Pod
metadata:
  name: ledger-extra
  namespace: starfleet
spec:
  containers:
    - name: writer
      image: docker.io/library/busybox:1.37.0
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: ledger
          mountPath: /ledger
  volumes:
    - name: ledger
      persistentVolumeClaim:
        claimName: ledger-current
