apiVersion: v1
kind: Pod
metadata:
  name: scout-relay
  namespace: starfleet
spec:
  containers:
    - name: writer
      image: docker.io/library/busybox:1.37.0
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: shared
          mountPath: /shared
    - name: reader
      image: docker.io/library/busybox:1.37.0
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: shared
          mountPath: /shared
        - name: settings
          mountPath: /etc/scout
          readOnly: true
  volumes:
    - name: shared
      emptyDir:
        medium: Memory
        sizeLimit: 64Mi
    - name: settings
      projected:
        sources:
          - configMap:
              name: scout-settings
          - secret:
              name: scout-token
              items:
                - key: token
                  path: token
                  mode: 0400
